name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pica_reader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: 版本号与 tag 必须一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d '[:space:]')
          if [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 pubspec 版本 $VER 不一致（应为 v$VER）"
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: 配置签名（缺失时退回 debug 并告警）
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > android/pica-release.jks
            cat > android/key.properties <<EOF
          storeFile=pica-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "使用仓库 Secrets 里的正式签名"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 等 Secrets，本次为 debug 签名——无法覆盖安装已发布版本"
          fi

      - name: 构建 APK
        run: flutter build apk --release

      - name: 重命名并记录散列
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d '[:space:]')
          NAME="pica_reader-${VER}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            pica_reader/${{ env.APK }}
            pica_reader/${{ env.APK }}.sha256

  windows:
    name: Windows 桌面版
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pica_reader
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: 打包 Release 目录
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value
          $ver = ($ver -split '\+')[0].Trim()
          $name = "pica_reader-$ver-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $name -CompressionLevel Optimal
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Set-Content "$name.sha256" -Encoding ascii
          "ZIP=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            pica_reader/${{ env.ZIP }}
            pica_reader/${{ env.ZIP }}.sha256

  release:
    name: 发布
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 合并散列文件
        run: |
          cd dist
          cat *.sha256 > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
